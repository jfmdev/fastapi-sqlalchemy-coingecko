<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coin prices</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-body-tertiary">
    <main class="container py-4 py-md-5" x-data="coinApp()" x-cloak>
        <header class="mb-4">
            <h1>Coin prices</h1>
            <p class="text-body-secondary mb-0">Select a coin to see its current price in USD.</p>
        </header>

        <div class="row g-4">
            <section class="col-lg-7" aria-labelledby="coins-heading">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h4" id="coins-heading">Available coins</h2>
                        <label class="form-label" for="coin-search">Search by name, symbol, or ID</label>
                        <input id="coin-search" class="form-control mb-3" type="search"
                               placeholder="Search coins" x-model="search" @input="limit = 100">

                        <p x-show="loadingCoins" role="status">Loading coins...</p>
                        <div x-show="coinError" class="alert alert-danger" role="alert">
                            <span x-text="coinError"></span>
                            <button type="button" class="btn btn-sm btn-outline-danger ms-2" @click="loadCoins()">Retry</button>
                        </div>
                        <p x-show="!loadingCoins && !coinError && filteredCoins.length === 0" role="status">No coins found.</p>

                        <div class="list-group">
                            <template x-for="coin in filteredCoins.slice(0, limit)" :key="coin.id">
                                <button type="button" class="list-group-item list-group-item-action"
                                        :class="{ 'active': selectedCoin && selectedCoin.id === coin.id }"
                                        :aria-pressed="selectedCoin && selectedCoin.id === coin.id"
                                        @click="selectCoin(coin)">
                                    <span class="fw-semibold" x-text="coin.name"></span>
                                    <span x-text="' (' + coin.symbol.toUpperCase() + ')'"></span>
                                    <small class="d-block" x-text="coin.id"></small>
                                </button>
                            </template>
                        </div>
                        <button type="button" class="btn btn-outline-primary mt-3"
                                x-show="limit < filteredCoins.length" @click="limit += 100">
                            Show more
                        </button>
                    </div>
                </div>
            </section>

            <section class="col-lg-5" aria-labelledby="price-heading">
                <div class="card shadow-sm">
                    <div class="card-body" aria-live="polite">
                        <h2 class="h4" id="price-heading">Current price</h2>
                        <p x-show="!selectedCoin" class="text-body-secondary mb-0">Choose a coin from the list.</p>
                        <template x-if="selectedCoin">
                            <div>
                                <h3 class="h5" x-text="selectedCoin.name"></h3>
                                <p class="text-body-secondary" x-text="selectedCoin.id"></p>
                                <p x-show="loadingPrice" role="status">Loading price...</p>
                                <p x-show="priceError" class="text-danger" role="alert" x-text="priceError"></p>
                                <p x-show="!loadingPrice && !priceError && price !== null"
                                   class="fs-3 fw-bold mb-0" x-text="formattedPrice"></p>
                                <button type="button" class="btn btn-outline-primary mt-3"
                                        x-show="!loadingPrice" @click="selectCoin(selectedCoin)">Refresh price</button>
                            </div>
                        </template>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        function coinApp() {
            return {
                coins: [],
                search: '',
                limit: 100,
                loadingCoins: true,
                coinError: '',
                selectedCoin: null,
                price: null,
                loadingPrice: false,
                priceError: '',
                priceRequest: 0,
                get filteredCoins() {
                    const query = this.search.trim().toLowerCase();
                    if (!query) return this.coins;
                    return this.coins.filter(coin =>
                        [coin.name, coin.symbol, coin.id].some(value => value.toLowerCase().includes(query))
                    );
                },
                get formattedPrice() {
                    return new Intl.NumberFormat('en-US', {
                        style: 'currency', currency: 'USD', maximumFractionDigits: 20
                    }).format(this.price);
                },
                async init() {
                    await this.loadCoins();
                },
                async loadCoins() {
                    this.loadingCoins = true;
                    this.coinError = '';
                    try {
                        const response = await fetch('/coin/list');
                        if (!response.ok) throw new Error('Could not load coins (HTTP ' + response.status + ').');
                        const coins = await response.json();
                        if (!Array.isArray(coins) || !coins.every(coin =>
                            coin && typeof coin.id === 'string' &&
                            typeof coin.name === 'string' && typeof coin.symbol === 'string'
                        )) throw new Error('The coin list returned an unexpected response.');
                        this.coins = coins;
                    } catch (error) {
                        this.coinError = error.message || 'Could not load coins.';
                    } finally {
                        this.loadingCoins = false;
                    }
                },
                async selectCoin(coin) {
                    const request = ++this.priceRequest;
                    this.selectedCoin = coin;
                    this.price = null;
                    this.priceError = '';
                    this.loadingPrice = true;
                    try {
                        const response = await fetch('/price?coin=' + encodeURIComponent(coin.id));
                        if (!response.ok) throw new Error('Could not load price (HTTP ' + response.status + ').');
                        const data = await response.json();
                        if (request !== this.priceRequest) return;
                        const price = data?.[coin.id]?.usd;
                        if (typeof price !== 'number' || !Number.isFinite(price)) {
                            throw new Error('A USD price is not available for this coin.');
                        }
                        this.price = price;
                    } catch (error) {
                        if (request === this.priceRequest) {
                            this.priceError = error.message || 'Could not load price.';
                        }
                    } finally {
                        if (request === this.priceRequest) this.loadingPrice = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
